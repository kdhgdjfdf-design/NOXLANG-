.nav{display:flex;flex-direction:column;overflow:visible;gap:7px;padding:0;background:transparent;position:sticky;top:14px;scroll-snap-type:none}
.nav button{flex:initial;width:100%;min-height:66px;border:1px solid transparent;border-inline-start:3px solid transparent;border-radius:16px;padding:10px 12px;gap:11px;background:transparent;color:var(--muted);box-shadow:none}

.btn.primary{box-shadow:0 4px 12px #5486c826}
.wordrow{border-radius:16px;padding:15px 16px}
.practice{border-radius:18px;padding:19px}
.options button{border-radius:14px;padding:13px 15px;min-height:48px;transition:border-color .15s,background .15s}
.options button:hover{border-color:var(--blue)}

.footer{padding:10px 0 0}

 .nav button:hover{transform:none}
 .nav .dot{width:31px;height:31px;flex:0 0 31px;border-radius:10px;font-size:16px}
 .nav button span:last-child{display:block;font-size:10px;white-space:nowrap}
 .nav small{display:none}
 .sectionhead{align-items:center}
 .sectionhead h2{font-size:23px}
 .cards{grid-template-columns:1fr;gap:12px}

 .card[data-action="lesson-card"] .btn{margin-top:2px}
 .wordrow{padding:12px}
 .practice{padding:15px}
 .stepper{gap:4px!important}
 .stepper>div{font-size:10px!important;padding:7px 1px!important}
 .footer{font-size:11px}
}
@media(min-width:761px) and (max-width:980px){

 .cards{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

function act(a,b){let i=Number(b.dataset.i),l=lessons[i];if(a==='lesson'||a==='lesson-card'){activeLesson=i;lessonStep=0;lessonScore=0;quizFeedback='';$('#content').innerHTML=lessonView(i);bind()}if(a==='backlearn'){quizFeedback='';setView('learn')}if(a==='say')speak(decodeURIComponent(b.dataset.text));if(a==='sayword')speak(decodeURIComponent(b.dataset.text),.78);if(a==='lessonNext'){lessonStep=Math.min(3,lessonStep+1);quizFeedback='';$('#content').innerHTML=lessonView(activeLesson);bind()}if(a==='answer'){quizFeedback=b.dataset.j;state.attempts++;if(Number(quizFeedback)===lessons[activeLesson].correct)lessonScore++;save();$('#content').innerHTML=lessonView(activeLesson);bind()}if(a==='typeCheck'){let inp=$('#lessonTyped'),val=(inp?inp.value:'').trim().toLocaleLowerCase().replace(/[.!?؟]/g,'').replace(/’/g,"'");let ans=decodeURIComponent(b.dataset.answer).toLocaleLowerCase().replace(/[.!?؟]/g,'').replace(/’/g,"'");let ok=val===ans||val.replace(/\s+/g,' ')===(ans.replace(/\s+/g,' '));state.attempts++;if(ok)lessonScore++;save();$('#typedFeedback').innerHTML='<div class="feedback">'+(ok?'صحيح! ممتاز، تذكّرت العبارة بنفسك.':'قريب! الإجابة النموذجية: <strong dir="ltr">'+decodeURIComponent(b.dataset.answer)+'</strong>')+'</div>';b.disabled=true;let n=document.createElement('button');n.className='btn primary';n.style.marginTop='10px';n.textContent='متابعة ←';n.dataset.action='lessonNext';$('#typedFeedback').appendChild(n);bind()}if(a==='tilePick'){let area=$('#tileAnswer');if(area){if(area.querySelector('[data-picked="'+b.dataset.tile+'"]'))return;let empty=area.querySelector('.muted');if(empty)empty.remove();let chip=document.createElement('button');chip.className='btn';chip.dataset.picked=b.dataset.tile;chip.dataset.action='tileRemove';chip.textContent=decodeURIComponent(b.dataset.word)+' ×';area.appendChild(chip);b.disabled=true;bind()}}if(a==='tileRemove'){let area=$('#tileAnswer'),idx=b.dataset.picked;if(area){b.remove();let src=document.querySelector('[data-action="tilePick"][data-tile="'+idx+'"]');if(src)src.disabled=false;if(!area.querySelector('[data-picked]'))area.innerHTML='<span class="muted">اختيارك سيظهر هنا</span>';bind()}}if(a==='tileCheck'){let area=$('#tileAnswer'),got=area?[...area.querySelectorAll('[data-picked]')].map(x=>x.textContent.replace(/ ×$/,'')).join(' '):'',expected=decodeURIComponent(b.dataset.correct);let normalize=x=>x.toLocaleLowerCase().replace(/[’']/g,"'").replace(/[.!?]/g,'').trim().replace(/\s+/g,' ');let ok=normalize(got)===normalize(expected);state.attempts++;if(ok)lessonScore++;save();$('#tileFeedback').innerHTML='<div class="feedback">'+(ok?'رائع! رتّبت الجملة بشكل صحيح.':'ليست مرتبة تمامًا. الترتيب الصحيح: <strong dir="ltr">'+expected+'</strong>')+'</div>';let n=document.createElement('button');n.className='btn primary';n.style.marginTop='10px';n.textContent='إنهاء الدرس وحفظ التقدم ✓';n.dataset.action='complete';n.dataset.i=activeLesson;$('#tileFeedback').appendChild(n);bind()}if(a==='complete'){let doneLesson=lessons[activeLesson];if(!state.done.includes(doneLesson.id))state.done.push(doneLesson.id);save();quizFeedback='';setView('learn')}if(a==='mic')startMic();if(a==='checkreply'){let input=$('#reply').value.trim(),s=scenarios[selectedScenario];state.attempts++;save();let ok=s.expected.some(x=>input.toLowerCase().includes(x));$('#replyFeedback').innerHTML='<div class="feedback">'+(input.length<2?'اكتب جملة قصيرة بالفرنسية أولًا.':ok?'جيد، استخدمت تعبيرًا مناسبًا للموقف. راجع الاقتراح أيضًا لتطوير إجابتك.':'حاول تضمين تحية أو عبارة مرتبطة بالموقف، ثم قارن إجابتك بالنموذج.')+'<br><strong>اقتراح:</strong> <span dir="ltr">'+s.sample+'</span><br>'+s.reply+'</div>'}if(a==='podpick'){activePodcast=i;render()}if(a==='podplay'){let sp=$('#audioSpeed');speak(podcasts[activePodcast].text,sp?Number(sp.value):.82)}if(a==='podslow')speak(podcasts[activePodcast].text,.68);if(a==='podcheck'){let p=podcasts[activePodcast],results=p.answers.map((ans,j)=>{let val=$('#podanswer'+j).value.toLowerCase();return val.includes(ans.toLowerCase())|| (j===0&&/marché|marche|marché|march/.test(val))});state.attempts++;save();$('#podFeedback').innerHTML='<div class="feedback">'+results.map((ok,j)=>(ok?'✓ ':'• ')+p.questions[j]+' — '+p.ar[j]).join('<br>')+'</div>'}if(a==='describe'||a==='story'||a==='grammar'||a==='writing')showSchool(a);if(a==='theme')$('#themeBtn').click();if(a==='voiceTest')speak("Bonjour ! Bienvenue dans NOX LANG. Comment ça va ?",.86);if(a==='changeLevel'){state.setupDone=false;render()}if(a==='reset'){$('#resetFeedback').innerHTML='<div class="feedback">هل تريد فعلًا مسح تقدّم الدروس؟ <button class="btn" id="confirmReset">تأكيد المسح</button></div>';$('#confirmReset').onclick=()=>{state.done=[];state.attempts=0;save();render()}}}
function showSchool(a){let box=$('#schoolPractice');let data={describe:{title:'وصف صورة',prompt:'Sur cette image, je vois…',hint:'اذكر المكان، الأشخاص، ما يفعلونه، ثم رأيك.'},story:{title:'كتابة قصة',prompt:'Un jour, … Puis, … Soudain, … Enfin, …',hint:'اربط الأحداث بترتيب واضح، واستخدم جملًا قصيرة.'},grammar:{title:'مراجعة القواعد',prompt:'Un homme vend du pain dans une rue.',hint:'تذكّر: rue مؤنثة، لذلك نقول une rue. جرّب كتابة جملة مشابهة.'},writing:{title:'اكتب نصًا بالفرنسية',prompt:'',hint:'اكتب فقرة من 3 إلى 6 جمل. ستتلقى ملاحظات أولية وليست تصحيحًا آليًا كاملًا.'}}[a];box.innerHTML='<article class="card"><h3>'+data.title+'</h3><p>'+data.hint+'</p><div class="practice" dir="ltr" style="text-align:left">'+data.prompt+'</div><textarea id="myText" placeholder="Écris ton texte ici…"></textarea><div class="row" style="margin-top:10px"><button class="btn primary" id="reviewText">راجع النص</button><button class="btn" id="sayPrompt">استمع إلى المثال</button></div><div id="textFeedback"></div></article>';$('#sayPrompt').onclick=()=>speak(data.prompt||'Bonjour, je voudrais apprendre le français.');$('#reviewText').onclick=()=>{let t=$('#myText').value.trim(),words=t.split(/\s+/).filter(Boolean),caps=(t.match(/[.!?]/g)||[]).length;state.attempts++;save();let tips=[];if(!t)tips.push('ابدأ بكتابة جملة واحدة على الأقل.');else{if(!/[.!?]$/.test(t))tips.push('أضف علامة ترقيم في نهاية الجملة.');if(words.length<8)tips.push('حاول إضافة تفاصيل بسيطة باستخدام جمل قصيرة.');if(!/\b(un|une|le|la|les|il|elle|je|puis|ensuite|enfin|soudain)\b/i.test(t))tips.push('جرّب استخدام أداة تعريف أو كلمة ربط مثل puis أو enfin.');if(caps<2&&words.length>12)tips.push('قسّم النص إلى جمل واضحة باستخدام النقاط.');}if(t&&tips.length===0)tips.push('واصل! اقرأ النص بصوت مسموع وتأكد من توافق الأفعال مع الفاعل.');$('#textFeedback').innerHTML='<div class="feedback"><strong>ملاحظات للتطوير</strong><br>'+tips.join('<br>')+'<br><span class="muted">عدد الكلمات: '+words.length+'. هذه مراجعة إرشادية أولية وليست مدققًا نحويًا كاملًا.</span></div>'}}
async function startMic(){let status=$('#micStatus')||$('#replyFeedback');if(!status){alert('افتح قسم النطق أو المحادثة أولًا.');return}status.classList.remove('hidden');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){status.innerHTML='التسجيل غير مدعوم في هذا المتصفح أو يحتاج إلى اتصال آمن HTTPS. جرّب Chrome على رابط GitHub Pages المنشور.';return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'}),url=URL.createObjectURL(blob);status.innerHTML='تم تسجيل مقطعك. استمع إليه وكرّر المحاولة إن أردت.<br><audio controls src="'+url+'" style="width:100%;margin-top:8px"></audio><br><span class="muted">لم يُرسل التسجيل إلى أي خادم.</span>';stream.getTracks().forEach(t=>t.stop());let btn=document.querySelector('[data-action="mic"]');if(btn)btn.textContent='🎙 سجّل مرة أخرى'};recorder.start();status.innerHTML='التسجيل يعمل… تحدث بالفرنسية، ثم اضغط زر الميكروفون مرة أخرى لإيقافه.';let btn=document.querySelector('[data-action="mic"]');if(btn){btn.textContent='■ إيقاف التسجيل';btn.onclick=()=>{if(recorder&&recorder.state==='recording')recorder.stop()}}}catch(e){status.innerHTML='لم نستطع فتح الميكروفون. تحقق من إذن الميكروفون في المتصفح ثم حاول مجددًا.'}}
