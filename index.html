order-inline-start:4px solid var(--section-color,var(--blue));border-radius:15px;padding:12px;scroll-snap-align:start;transition:transform .18s,border-color .18s,background .18s}.nav button:hover{transform:translateY(-2px)}.nav button.active{background:var(--section-tint,var(--panel2));border-color:var(--section-color,var(--blue));color:var(--text);box-shadow:var(--shadow)}.nav button:nth-child(1){--section-color:#5486c8;--section-tint:#5486c822}.nav button:nth-child(2){--section-color:#398456;--section-tint:#39845622}.nav button:nth-child(3){--section-color:#9065b3;--section-tint:#9065b322}.nav button:nth-child(4){--section-color:#ad762f;--section-tint:#ad762f22}.nav button:nth-child(5){--section-color:#c14e54;--section-tint:#c14e5422}.nav button:nth-child(6){--section-color:#6b829e;--section-tint:#6b829e22}.nav .dot{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;font-size:18px}.nav small{display:block;color:var(--muted);font-size:11px}.content{min-width:0}.sectionhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.sectionhead h2{margin-bottom:3px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.card h3{font-size:17px;margin-bottom:7px}.card p{color:var(--muted);font-size:14px;margin-bottom:14px}.tag{display:inline-flex;padding:4px 9px;border-radius:9px;font-size:12px;background:var(--panel2);margin-bottom:10px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.stack{display:grid;gap:13px}.lessonword{font-size:clamp(28px,5vw,42px);font-weight:800;direction:ltr;text-align:center;margin:12px}.translation{text-align:center;color:var(--muted)}.wordrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 14px;margin:9px 0;background:var(--panel2);border:1px solid var(--line);border-radius:15px}.wordcopy{min-width:0;flex:1}.wordfr{font-size:clamp(18px,3vw,23px);font-weight:800;line-height:1.35;direction:ltr;text-align:left;letter-spacing:.2px}.wordar{color:var(--muted);font-size:14px;margin-top:5px}.soundbtn{flex:0 0 auto;min-width:46px;min-height:46px;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);font-size:19px;box-shadow:0 3px 10px #080c1412;transition:background .18s,transform .18s}.soundbtn:hover{background:var(--panel2)}.soundbtn:active{transform:scale(.96)}.card[data-action="lesson-card"]{cursor:pointer;transition:transform .18s,border-color .18s}.card[data-action="lesson-card"]:hover{transform:translateY(-2px);border-color:var(--blue)}.card[data-action="lesson-card"]:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.practice{border:1px solid var(--line);border-radius:15px;padding:16px;background:var(--panel2);margin:12px 0}.options{display:grid;gap:8px}.options button{text-align:right;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px}.options button.correct{border-color:#398456;background:#39845622}.options button.wrong{border-color:var(--red)}input,textarea,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:110px;resize:vertical}.feedback{padding:12px;border-radius:12px;background:var(--panel2);margin-top:10px}.hidden{display:none!important}.bigicon{font-size:30px}.transcript{font-size:clamp(18px,3vw,22px);line-height:2.15;letter-spacing:.15px}.transcript-word{display:inline-block;direction:ltr;unicode-bidi:isolate;margin:2px 3px;padding:3px 7px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font:inherit;cursor:pointer;transition:background .15s,border-color .15s}.transcript-word:hover{background:var(--blue);border-color:var(--blue);color:#fff}.audio-panel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px;background:var(--panel2);border:1px solid var(--line);border-radius:15px;margin:14px 0}.audio-mark{width:42px;height:42px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);display:grid;place-items:center;font-size:20px}.audio-note{font-size:12px;color:var(--muted)}.speed-select{width:auto;min-width:115px;padding:9px}.footer{margin-top:24px;text-align:center;color:var(--muted);font-size:12px}.settingsrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.pill{font-size:12px;color:var(--muted)}@media(max-width:720px){.app{padding:13px 12px 40px}.nav{top:0;bottom:auto;margin:0 -2px;gap:8px;padding:7px 2px 10px}.nav button{flex-basis:164px;min-height:64px;padding:9px;font-size:13px}.nav .dot{width:34px;height:34px;flex-basis:34px;font-size:16px}.nav small{display:block;font-size:10px}.cards{grid-template-columns:1fr}.hero{padding:20px}.sectionhead{align-items:center}.top{margin-bottom:16px}.wordrow{padding:11px}.wordfr{font-size:19px}.transcript-word{padding:3px 5px;margin:2px;font-size:17px}}@media(min-width:721px){.app{padding-top:28px}}

<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">N</div><div><h1>NOX LANG</h1><small>تعلم الفرنسية بطريقتك</small></div></div><button class="iconbtn" id="themeBtn" aria-label="تغيير المظهر">☼ / ◐</button></header>
<section class="hero"><div class="eyebrow">TON FRANÇAIS, TON RYTHME</div><h2>Bonjour ! مستعد تتقدم؟</h2><p>استمع، افهم، جرّب، ثم استخدم الفرنسية في حياتك. تقدّمك محفوظ على هذا الجهاز.</p><div class="progressline"><span id="heroProgress"></span></div><div class="row"><strong id="progressLabel">0 درس مكتمل</strong><span class="pill">• تعلم خطوة كل يوم</span></div></section>
<div class="layout"><nav class="nav" aria-label="الأقسام">
<button class="active" data-view="learn"><span class="dot" style="background:#dceBff;color:#2459a9">▤</span><span>التعلّم<small>دروس وقواعد</small></span></button>
<button data-view="pronounce"><span class="dot" style="background:#ddf4e4;color:#237442">♫</span><span>النطق والاستماع<small>اسمع وجرّب</small></span></button>
<button data-view="speak"><span class="dot" style="background:#f2e4ff;color:#7540a0">☏</span><span>المحادثة<small>مواقف حقيقية</small></span></button>
<button data-view="podcast"><span class="dot" style="background:#fbe6c8;color:#955a13">♫</span><span>بودكاست<small>استماع وفهم</small></span></button>
<button data-view="school"><span class="dot" style="background:#ffe2e2;color:#b53a42">✎</span><span>الدراسة والكتابة<small>تعبير وامتحانات</small></span></button>
<button data-view="progress"><span class="dot" style="background:var(--panel2)">◷</span><span>تقدّمي<small>مراجعة وإعدادات</small></span></button>
</nav><main class="content" id="content" aria-live="polite"></main></div>
<div class="footer">NOX LANG · النسخة التجريبية · تُحفظ بيانات التقدّم محليًا في متصفحك</div>
</div>
<script>
const $=s=>document.querySelector(s);
const lessons=[
{id:'greetings',level:'A1 · البداية',title:'التحية والتعارف',desc:'ابدأ محادثة بسيطة بالفرنسية.',words:[['Bonjour','مرحبًا'],['Salut','أهلًا (غير رسمي)'],['Comment ça va ?','كيف حالك؟'],['Je m\'appelle…','اسمي…'],['Merci','شكرًا']],q:'ماذا تعني «Comment ça va ?»؟',opts:['كيف حالك؟','إلى اللقاء','شكرًا'],correct:0,tip:'تُستخدم للسؤال عن الحال. يمكنك الرد: Ça va bien, merci.'},
{id:'articles',level:'A1 · القواعد',title:'أدوات التعريف والتنكير',desc:'ميّز بين un و une و le و la.',words:[['un livre','كتاب (مذكر)'],['une rue','شارع (مؤنث)'],['le pain','الخبز'],['la maison','المنزل']],q:'اختر الجملة الصحيحة:',opts:['Un rue est longue.','Une rue est longue.','Une rue sont longue.'],correct:1,tip:'كلمة rue مؤنثة؛ نقول une rue. الصفة longue تتفق معها في التأنيث.'},
{id:'verbs',level:'A1 · الأفعال',title:'أفعال يومية',desc:'استخدم أفعالًا أساسية في جمل قصيرة.',words:[['Je parle français.','أنا أتحدث الفرنسية.'],['Il vend du pain.','هو يبيع الخبز.'],['Elle aide un homme.','هي تساعد رجلًا.'],['Nous allons à l’école.','نحن نذهب إلى المدرسة.']],q:'كيف تقول «هو يبيع الخبز»؟',opts:['Il vend du pain.','Il vendre du pain.','Il vendu le pain.'],correct:0,tip:'الفعل vendre مع il يصبح vend في المضارع.'},
{id:'past',level:'A1 · السرد',title:'احكِ ما حدث',desc:'تعرّف على الماضي المركب لكتابة قصة قصيرة.',words:[['Il a trouvé','لقد وجد'],['Elle a aidé','لقد ساعدت'],['Puis','ثم'],['Enfin','أخيرًا']],q:'اختر الماضي الصحيح: «Il ___ un sac.»',opts:['a trouvé','est trouver','a trouver'],correct:0,tip:'في passé composé نستخدم غالبًا avoir + participe passé: il a trouvé.'}
];
const podcasts=[
{title:'Au marché',level:'A1',text:'Bonjour monsieur. Je voudrais une baguette, s’il vous plaît. Voilà. Combien ça coûte ? Ça coûte un euro vingt. Merci, bonne journée !',questions:['أين تدور المحادثة؟','ماذا يريد الشخص أن يشتري؟'],answers:['au marché','une baguette'],ar:['في السوق أو المخبز','خبزة باغيت']},
{title:'Une journée à l’école',level:'A1',text:'Le matin, je vais à l’école à huit heures. J’étudie le français et les mathématiques. À midi, je déjeune avec mes amis. L’après-midi, je rentre à la maison.',questions:['À quelle heure va-t-il à l’école ?','Avec qui déjeune-t-il ?'],answers:['huit heures','mes amis'],ar:['في الثامنة','مع أصدقائه']}
];
const scenarios=[{title:'في المخبز',line:'Bonjour ! Qu’est-ce que vous désirez ?',hint:'مرحبًا! ماذا تريد؟',expected:['bonjour','baguette','pain','voudrais','merci'],reply:'Très bien ! Vous pouvez répondre : « Je voudrais une baguette, s’il vous plaît. »',sample:'Je voudrais une baguette, s’il vous plaît.'},{title:'التعارف',line:'Bonjour ! Comment vous appelez-vous ?',hint:'مرحبًا! ما اسمك؟',expected:['je m’appelle','je m\'appelle','mon nom'],reply:'جيد! يمكنك أن تقول: « Je m’appelle … »',sample:'Je m’appelle …'},{title:'في المدرسة',line:'Salut ! Tu aimes le français ?',hint:'أهلًا! هل تحب الفرنسية؟',expected:['oui','non','j’aime','parce que'],reply:'يمكنك قول: « Oui, j’aime le français parce que c’est intéressant. »',sample:'Oui, j’aime le français parce que c’est intéressant.'}];
let state=JSON.parse(localStorage.getItem('noxlang-state')||'{"done":[],"attempts":0,"theme":"dark","goal":"both"}');let view='learn',activeLesson=0,selectedScenario=0,activePodcast=0,quizFeedback='',recording=null,recorder=null,recognition=null;
function save(){localStorage.setItem('noxlang-state',JSON.stringify(state));updateProgress()}
function updateProgress(){let pct=Math.round(state.done.length/lessons.length*100);$('#heroProgress').style.width=pct+'%';$('#progressLabel').textContent=state.done.length+' من '+lessons.length+' دروس مكتملة';}
function speak(text,rate=0.86){if(!('speechSynthesis'in window)){alert('تشغيل الصوت غير مدعوم في هذا المتصفح. جرّب Chrome المحدّث.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=rate;let voices=speechSynthesis.getVoices();let v=voices.find(x=>x.lang.toLowerCase().startsWith('fr'));if(v)u.voice=v;speechSynthesis.speak(u)}
function setView(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme==='light'?'light':'dark';save()};
document.documentElement.dataset.theme=state.theme==='light'?'light':'dark';
function card(tag,title,desc,button,action){return '<article class="card"><span class="tag">'+tag+'</span><h3>'+title+'</h3><p>'+desc+'</p><button class="btn primary" data-action="'+action+'">'+button+'</button></article>'}
function render(){let c=$('#content');if(view==='learn')c.innerHTML=learnView();if(view==='pronounce')c.innerHTML=pronounceView();if(view==='speak')c.innerHTML=speakView();if(view==='podcast')c.innerHTML=podcastView();if(view==='school')c.innerHTML=schoolView();if(view==='progress')c.innerHTML=progressView();bind()}
function learnView(){return '<div class="sectionhead"><div><h2>التعلّم</h2><div class="muted">دروس قصيرة تبني معرفتك خطوة بخطوة.</div></div><span class="tag">A1 · مبتدئ</span></div><div class="cards">'+lessons.map((l,i)=>'<article class="card" data-action="lesson-card" data-i="'+i+'" role="button" tabindex="0"><span class="tag">'+l.level+'</span><h3>'+l.title+(state.done.includes(l.id)?' ✓':'')+'</h3><p>'+l.desc+'</p><button class="btn primary" data-action="lesson" data-i="'+i+'">'+(state.done.includes(l.id)?'راجع الدرس':'ابدأ الدرس')+'　↗</button><div class="muted" style="font-size:12px;margin-top:9px">اضغط على البطاقة لفتح الدرس</div></article>').join('')+'</div>'}
function lessonView(i){let l=lessons[i];return '<div class="sectionhead"><div><button class="btn" data-action="backlearn">← رجوع للدروس</button><h2 style="margin-top:14px">'+l.title+'</h2><div class="muted">'+l.level+'</div></div></div><div class="card"><h3>1. استمع وكرّر</h3>'+l.words.map(w=>'<div class="wordrow"><div class="wordcopy"><div class="wordfr">'+w[0]+'</div><div class="wordar">'+w[1]+'</div></div><button class="soundbtn" aria-label="استمع إلى '+w[0]+'" data-action="say" data-text="'+encodeURIComponent(w[0])+'">♫</button></div>').join('')+'<div class="practice"><h3>2. جرّب بنفسك</h3><p>'+l.q+'</p><div class="options">'+l.opts.map((o,j)=>'<button data-action="answer" data-j="'+j+'" class="'+(quizFeedback!==''&&j===l.correct?'correct':quizFeedback!==''&&j===Number(quizFeedback)?'wrong':'')+'">'+o+'</button>').join('')+'</div>'+(quizFeedback!==''?'<div class="feedback">'+(Number(quizFeedback)===l.correct?'إجابة صحيحة! أحسنت.':'ليس تمامًا. لا بأس، تعلّم من الخطأ.')+'<br>'+l.tip+'</div>':'')+'</div><button class="btn primary" data-action="complete" data-i="'+i+'">'+(state.done.includes(l.id)?'الدرس مكتمل ✓':'إنهاء الدرس وحفظ التقدم')+'</button></div>'}
function pronounceView(){let pairs=[['u / ou','tu — tout','جرّب تدوير الشفتين في صوت u، وقارن الصوتين.'],['r الفرنسية','rue — rouge','الصوت يأتي من مؤخرة الفم، وليس مثل الراء العربية تمامًا.'],['الصوت الأنفي','bon — banc','لاحظ مرور جزء من الهواء عبر الأنف.'],['الحروف الصامتة','petit — grand','قد لا يُنطق الحرف الأخير في بعض الكلمات.']];return '<div class="sectionhead"><div><h2>النطق والاستماع</h2><div class="muted">اسمع الصوت، لاحظ طريقة نطقه، ثم جرّب.</div></div></div><div class="card"><h3>استمع إلى كلمة فرنسية</h3><p>اختر كلمة، استمع إلى نطقها الفرنسي، ثم كرّرها بصوتك.</p><div class="row"><button class="btn primary" data-action="say" data-text="'+encodeURIComponent('Bonjour, je m’appelle Paul. Je voudrais apprendre le français.')+'">♫ استمع إلى جملة</button><button class="btn" data-action="mic">🎙 جرّب الميكروفون</button></div><div id="micStatus" class="feedback hidden"></div><p class="muted" style="margin-top:10px">تسجيل الصوت لا يُرفع إلى خادم في هذه النسخة. تحليل دقة مخارج الحروف المتقدم غير مفعّل بعد.</p></div><div class="stack" style="margin-top:13px">'+pairs.map(p=>'<article class="card"><span class="tag">تدريب صوتي</span><h3>'+p[0]+'</h3><div class="lessonword">'+p[1]+'</div><p>'+p[2]+'</p><button class="btn primary" data-action="say" data-text="'+encodeURIComponent(p[1])+'">♫ استمع وكرّر</button></article>').join('')+'</div>'}
function speakView(){let s=scenarios[selectedScenario];return '<div class="sectionhead"><div><h2>المحادثة</h2><div class="muted">تدرّب على مواقف واقعية. اكتب ردّك بالفرنسية.</div></div></div><div class="card"><label for="scenario">اختر موقفًا</label><select id="scenario">'+scenarios.map((x,i)=>'<option value="'+i+'" '+(i===selectedScenario?'selected':'')+'>'+x.title+'</option>').join('')+'</select><div class="practice"><div class="muted">الطرف الآخر يقول:</div><h3 dir="ltr" style="text-align:left;margin-top:8px">'+s.line+'</h3><div class="row"><button class="btn" data-action="say" data-text="'+encodeURIComponent(s.line)+'">♫ استمع</button><span class="muted">'+s.hint+'</span></div></div><label for="reply">ردّك بالفرنسية</label><textarea id="reply" placeholder="Écris ta réponse en français…"></textarea><div class="row" style="margin-top:10px"><button class="btn primary" data-action="checkreply">راجع ردي</button><button class="btn" data-action="mic">🎙 جرّب الصوت</button></div><div id="replyFeedback"></div><p class="muted" style="margin-top:14px">المحادثة هنا تدريب نصّي موجّه، وليست بعدُ محادثة ذكاء اصطناعي صوتية مفتوحة.</p></div>'}
function podcastView(){let p=podcasts[activePodcast];return '<div class="sectionhead"><div><h2>الاستماع والبودكاست</h2><div class="muted">مقاطع قصيرة مع نص وأسئلة للفهم.</div></div></div><div class="row" style="margin-bottom:13px">'+podcasts.map((x,i)=>'<button class="btn '+(i===activePodcast?'primary':'')+'" data-action="podpick" data-i="'+i+'">'+x.title+'</button>').join('')+'</div><article class="card"><span class="tag">'+p.level+' · استماع قصير</span><h3>'+p.title+'</h3><div class="audio-panel"><div class="audio-mark">♫</div><div style="flex:1;min-width:150px"><strong>مشغّل الاستماع</strong><div class="audio-note">استمع للمقطع كاملًا أو اضغط أي كلمة في النص لسماعها منفردة</div></div><button class="btn primary" data-action="podplay">♫ تشغيل</button><button class="btn" data-action="podslow">◂ بطيء</button><select id="audioSpeed" class="speed-select" aria-label="سرعة الصوت"><option value="0.68">بطيئة جدًا</option><option value="0.82" selected>هادئة</option><option value="1">طبيعية</option></select></div><h3 style="margin-top:22px">النص</h3><div class="transcript" dir="ltr" style="text-align:left">'+p.text.split(/\s+/).map(w=>'<button class="transcript-word" data-action="sayword" data-text="'+encodeURIComponent(w.replace(/[.,!?;:]+$/,''))+'">'+w+'</button>').join(' ')+'</div><div class="practice"><h3>تحقّق من الفهم</h3>'+p.questions.map((q,i)=>'<label>'+q+'</label><input id="podanswer'+i+'" placeholder="Réponse en français" style="margin:7px 0 13px">').join('')+'<button class="btn primary" data-action="podcheck">تحقّق من إجاباتي</button><div id="podFeedback"></div></div><p class="muted">هذه مقاطع تعليمية قصيرة مولّدة داخل التطبيق باستخدام الصوت المتاح في جهازك، وليست بودكاستًا خارجيًا مسجّلًا.</p></article>'}
function schoolView(){return '<div class="sectionhead"><div><h2>الدراسة والكتابة</h2><div class="muted">تدرّب على الفرنسية المدرسية والتعبير.</div></div></div><div class="cards">'+card('وصف صورة','Décrire une image','رتّب وصفك: مقدمة، مكان، أشخاص، أفعال، ورأي.','تدريب الوصف','describe')+card('كتابة قصة','Raconter une histoire','استخدم Un jour, puis, soudain, alors, enfin.','تدريب القصة','story')+card('قواعد','Grammaire','تدرّب على أدوات التعريف والماضي وتركيب الجملة.','مراجعة القواعد','grammar')+card('كتابة حرة','Mon texte','اكتب فقرة قصيرة واحصل على ملاحظات أولية.','اكتب نصًا','writing')+'</div><div id="schoolPractice" style="margin-top:14px"></div>'}
function progressView(){return '<div class="sectionhead"><div><h2>تقدّمي</h2><div class="muted">محفوظ محليًا على هذا الجهاز.</div></div></div><div class="cards"><article class="card"><div class="muted">الدروس المكتملة</div><div class="lessonword">'+state.done.length+' / '+lessons.length+'</div></article><article class="card"><div class="muted">محاولات التدريب</div><div class="lessonword">'+state.attempts+'</div></article></div><article class="card" style="margin-top:13px"><h3>مراجعة الدروس</h3>'+lessons.map(l=>'<div class="settingsrow"><span>'+l.title+'</span><span class="pill">'+(state.done.includes(l.id)?'مكتمل ✓':'لم يكتمل')+'</span></div>').join('')+'<div class="settingsrow"><span>المظهر</span><button class="btn" data-action="theme">تغيير فاتح / داكن</button></div><div class="settingsrow"><span>حفظ التقدم</span><span class="pill">تلقائي على هذا الجهاز</span></div><button class="btn" style="margin-top:12px" data-action="reset">إعادة ضبط التقدم</button><div id="resetFeedback"></div></article>'}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>{b.onclick=e=>{e.stopPropagation();act(b.dataset.action,b)};if(b.dataset.action==='lesson-card')b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act('lesson-card',b)}}});let sel=$('#scenario');if(sel)sel.onchange=()=>{selectedScenario=Number(sel.value);render()}}
function act(a,b){let i=Number(b.dataset.i),l=lessons[i];if(a==='lesson'||a==='lesson-card'){activeLesson=i;quizFeedback='';$('#content').innerHTML=lessonView(i);bind()}if(a==='backlearn'){quizFeedback='';setView('learn')}if(a==='say')speak(decodeURIComponent(b.dataset.text));if(a==='sayword')speak(decodeURIComponent(b.dataset.text),.78);if(a==='answer'){quizFeedback=b.dataset.j;state.attempts++;save();$('#content').innerHTML=lessonView(activeLesson);bind()}if(a==='complete'){if(!state.done.includes(l.id))state.done.push(l.id);save();setView('learn')}if(a==='mic')startMic();if(a==='checkreply'){let input=$('#reply').value.trim(),s=scenarios[selectedScenario];state.attempts++;save();let ok=s.expected.some(x=>input.toLowerCase().includes(x));$('#replyFeedback').innerHTML='<div class="feedback">'+(input.length<2?'اكتب جملة قصيرة بالفرنسية أولًا.':ok?'جيد، استخدمت تعبيرًا مناسبًا للموقف. راجع الاقتراح أيضًا لتطوير إجابتك.':'حاول تضمين تحية أو عبارة مرتبطة بالموقف، ثم قارن إجابتك بالنموذج.')+'<br><strong>اقتراح:</strong> <span dir="ltr">'+s.sample+'</span><br>'+s.reply+'</div>'}if(a==='podpick'){activePodcast=i;render()}if(a==='podplay'){let sp=$('#audioSpeed');speak(podcasts[activePodcast].text,sp?Number(sp.value):.82)}if(a==='podslow')speak(podcasts[activePodcast].text,.68);if(a==='podcheck'){let p=podcasts[activePodcast],results=p.answers.map((ans,j)=>{let val=$('#podanswer'+j).value.toLowerCase();return val.includes(ans.toLowerCase())|| (j===0&&/marché|marche|marché|march/.test(val))});state.attempts++;save();$('#podFeedback').innerHTML='<div class="feedback">'+results.map((ok,j)=>(ok?'✓ ':'• ')+p.questions[j]+' — '+p.ar[j]).join('<br>')+'</div>'}if(a==='describe'||a==='story'||a==='grammar'||a==='writing')showSchool(a);if(a==='theme')$('#themeBtn').click();if(a==='reset'){$('#resetFeedback').innerHTML='<div class="feedback">هل تريد فعلًا مسح تقدّم الدروس؟ <button class="btn" id="confirmReset">تأكيد المسح</button></div>';$('#confirmReset').onclick=()=>{state.done=[];state.attempts=0;save();render()}}}
function showSchool(a){let box=$('#schoolPractice');let data={describe:{title:'وصف صورة',prompt:'Sur cette image, je vois…',hint:'اذكر المكان، الأشخاص، ما يفعلونه، ثم رأيك.'},story:{title:'كتابة قصة',prompt:'Un jour, … Puis, … Soudain, … Enfin, …',hint:'اربط الأحداث بترتيب واضح، واستخدم جملًا قصيرة.'},grammar:{title:'مراجعة القواعد',prompt:'Un homme vend du pain dans une rue.',hint:'تذكّر: rue مؤنثة، لذلك نقول une rue. جرّب كتابة جملة مشابهة.'},writing:{title:'اكتب نصًا بالفرنسية',prompt:'',hint:'اكتب فقرة من 3 إلى 6 جمل. ستتلقى ملاحظات أولية وليست تصحيحًا آليًا كاملًا.'}}[a];box.innerHTML='<article class="card"><h3>'+data.title+'</h3><p>'+data.hint+'</p><div class="practice" dir="ltr" style="text-align:left">'+data.prompt+'</div><textarea id="myText" placeholder="Écris ton texte ici…"></textarea><div class="row" style="margin-top:10px"><button class="btn primary" id="reviewText">راجع النص</button><button class="btn" id="sayPrompt">استمع إلى المثال</button></div><div id="textFeedback"></div></article>';$('#sayPrompt').onclick=()=>speak(data.prompt||'Bonjour, je voudrais apprendre le français.');$('#reviewText').onclick=()=>{let t=$('#myText').value.trim(),words=t.split(/\s+/).filter(Boolean),caps=(t.match(/[.!?]/g)||[]).length;state.attempts++;save();let tips=[];if(!t)tips.push('ابدأ بكتابة جملة واحدة على الأقل.');else{if(!/[.!?]$/.test(t))tips.push('أضف علامة ترقيم في نهاية الجملة.');if(words.length<8)tips.push('حاول إضافة تفاصيل بسيطة باستخدام جمل قصيرة.');if(!/\b(un|une|le|la|les|il|elle|je|puis|ensuite|enfin|soudain)\b/i.test(t))tips.push('جرّب استخدام أداة تعريف أو كلمة ربط مثل puis أو enfin.');if(caps<2&&words.length>12)tips.push('قسّم النص إلى جمل واضحة باستخدام النقاط.');}if(t&&tips.length===0)tips.push('واصل! اقرأ النص بصوت مسموع وتأكد من توافق الأفعال مع الفاعل.');$('#textFeedback').innerHTML='<div class="feedback"><strong>ملاحظات للتطوير</strong><br>'+tips.join('<br>')+'<br><span class="muted">عدد الكلمات: '+words.length+'. هذه مراجعة إرشادية أولية وليست مدققًا نحويًا كاملًا.</span></div>'}}
async function startMic(){let status=$('#micStatus')||$('#replyFeedback');if(!status){alert('افتح قسم النطق أو المحادثة أولًا.');return}status.classList.remove('hidden');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){status.innerHTML='التسجيل غير مدعوم في هذا المتصفح أو يحتاج إلى اتصال آمن HTTPS. جرّب Chrome على رابط GitHub Pages المنشور.';return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'}),url=URL.createObjectURL(blob);status.innerHTML='تم تسجيل مقطعك. استمع إليه وكرّر المحاولة إن أردت.<br><audio controls src="'+url+'" style="width:100%;margin-top:8px"></audio><br><span class="muted">لم يُرسل التسجيل إلى أي خادم.</span>';stream.getTracks().forEach(t=>t.stop());let btn=document.querySelector('[data-action="mic"]');if(btn)btn.textContent='🎙 سجّل مرة أخرى'};recorder.start();status.innerHTML='التسجيل يعمل… تحدث بالفرنسية، ثم اضغط زر الميكروفون مرة أخرى لإيقافه.';let btn=document.querySelector('[data-action="mic"]');if(btn){btn.textContent='■ إيقاف التسجيل';btn.onclick=()=>{if(recorder&&recorder.state==='recording')recorder.stop()}}}catch(e){status.innerHTML='لم نستطع فتح الميكروفون. تحقق من إذن الميكروفون في المتصفح ثم حاول مجددًا.'}}
function learnViewOrLesson(){return learnView()}
function render(){let c=$('#content');if(view==='learn')c.innerHTML=learnView();if(view==='pronounce')c.innerHTML=pronounceView();if(view==='speak')c.innerHTML=speakView();if(view==='podcast')c.innerHTML=podcastView();if(view==='school')c.innerHTML=schoolView();if(view==='progress')c.innerHTML=progressView();bind()}
updateProgress();render();
</script>
</body></html>
